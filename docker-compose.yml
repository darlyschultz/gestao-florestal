services:
  postgres:
    image: postgres:16-alpine
    container_name: gestao-florestal-db
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: florestal
      POSTGRES_PASSWORD: florestal
      POSTGRES_DB: gestao_florestal
    volumes:
      - gestao_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U florestal -d gestao_florestal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gestao_pg_data:
